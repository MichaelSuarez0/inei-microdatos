name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest tests/ -v

  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check optional dependencies are absent
        run: |
          uv run --isolated --no-dev --python 3.11 python -c "import importlib.util, inei_microdatos; assert importlib.util.find_spec('pandas') is None; assert importlib.util.find_spec('pyreadstat') is None; assert importlib.util.find_spec('openpyxl') is None"

      - name: Run optional dependency tests
        run: uv run --isolated --no-dev --with pytest --python 3.11 pytest tests/test_optional_dependencies.py -v